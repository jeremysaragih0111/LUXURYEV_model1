<!DOCTYPE html>
<html lang="id" class="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030614" />
    <title>Models — LUXURYEV</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/hologram.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>

    <div id="site-header"></div>

    <main id="main" class="container page">
      <div class="page-head">
        <p class="eyebrow">Our Collection</p>
        <h1 class="title">Premium Electric Models</h1>
        <p class="subtitle">Three masterpieces. One standard: excellence.</p>
      </div>

      <div id="models-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:28px;"></div>

      <div class="divider" aria-hidden="true"></div>

      <section id="model-viewer" style="text-align:center;">
        <h2 class="title" style="margin-bottom: 20px;">Explore in 3D</h2>
        <p class="subtitle" style="margin-bottom: 24px;">Rotate and interact with our holographic car model.</p>
        <div class="three-wrap">
          <canvas id="three-canvas"></canvas>
          <div id="three-fallback" hidden>
            <div class="three-fallback">⚡</div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/navigation.js"></script>
    <script src="js/core/theme.js"></script>
    <script src="js/core/particles.js"></script>
    <script src="js/core/reveal.js"></script>
    <script src="js/core/hologram.js"></script>
    <script src="js/core/three-scene.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/pages/models.js"></script>
  </body>
</html>
